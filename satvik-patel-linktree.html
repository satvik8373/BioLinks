<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satvik Patel — Links</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a2211;
    --screen-a:#c7d2ab;
    --screen-b:#b7c495;
    --case-hi:#eee6d4;
    --case-mid:#c9bfa9;
    --case-lo:#a89c85;
    --bezel:#141310;
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    min-height:100vh;
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    font-family:'Silkscreen', monospace;
  }

  /* ---------- CARD (frame removed) ---------- */
  .screen{
    position:relative;
    width:340px;
    max-width:92vw;
    border-radius:22px;
    overflow:hidden;
    background:
      repeating-linear-gradient(rgba(0,0,0,0.05) 0px, rgba(0,0,0,0.05) 1px, transparent 1px, transparent 3px),
      radial-gradient(120% 90% at 30% 0%, var(--screen-a), var(--screen-b) 70%);
    box-shadow:
      0 20px 40px -16px rgba(0,0,0,0.35),
      inset 0 0 24px rgba(0,0,0,0.2);
    color:var(--ink);
    padding:18px 18px 22px;
  }

  /* subtle vignette */
  .screen::after{
    content:"";
    position:absolute; inset:0;
    background: radial-gradient(120% 90% at 50% 0%, transparent 55%, rgba(0,0,0,0.16) 100%);
    pointer-events:none;
  }

  /* ---------- STATUS BAR ---------- */
  .statusbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:13px;
    letter-spacing:1px;
    padding-bottom:8px;
    position:relative;
    z-index:1;
  }
  .statusbar .status-icons{ display:flex; align-items:center; gap:6px; }
  .signal-bars{ display:flex; align-items:flex-end; gap:1px; height:9px; }
  .signal-bars span{ width:2px; background:var(--ink); display:block; }
  .signal-bars span:nth-child(1){ height:3px; }
  .signal-bars span:nth-child(2){ height:5px; }
  .signal-bars span:nth-child(3){ height:7px; }
  .signal-bars span:nth-child(4){ height:9px; }
  .battery{
    width:20px; height:10px;
    border:1.5px solid var(--ink);
    border-radius:2px;
    position:relative;
    display:flex;
    align-items:center;
    padding:1.5px;
  }
  .battery::after{
    content:"";
    position:absolute; right:-4px; top:2.5px;
    width:2px; height:5px;
    background:var(--ink);
    border-radius:0 1px 1px 0;
  }
  .battery i{ display:block; width:75%; height:100%; background:var(--ink); }

  /* ---------- CREATOR TAG ---------- */
  .creator-tag{
    text-align:right;
    font-size:15px;
    text-decoration:underline;
    text-underline-offset:3px;
    margin-bottom:6px;
    position:relative; z-index:1;
  }

  /* ---------- AVATAR ---------- */
  .avatar-wrap{
    width:126px; height:126px;
    margin:4px auto 14px;
    border-radius:50%;
    border:2.5px solid var(--ink);
    display:flex; align-items:center; justify-content:center;
    background:transparent;
    position:relative; z-index:1;
    overflow:hidden;
  }
  .avatar-svg{
    width:118%; height:118%;
    fill:var(--ink);
    shape-rendering:crispEdges;
    transform:translateY(6%);
  }

  /* ---------- NAME / BIO ---------- */
  .name-row{
    display:flex; align-items:center; justify-content:center; gap:8px;
    font-size:26px;
    font-weight:700;
    margin-bottom:8px;
    position:relative; z-index:1;
  }
  .check-badge{ width:20px; height:20px; flex:0 0 auto; }
  .bio{
    text-align:center;
    font-size:14px;
    line-height:1.55;
    margin:0 0 16px;
    position:relative; z-index:1;
  }

  /* ---------- SOCIALS ---------- */
  .socials{
    display:flex; justify-content:center; gap:14px;
    margin-bottom:18px;
    position:relative; z-index:1;
  }
  .social-icon{
    width:42px; height:42px;
    border-radius:50%;
    border:2px dashed var(--ink);
    display:flex; align-items:center; justify-content:center;
    color:var(--ink);
    text-decoration:none;
  }
  .social-icon svg{ width:20px; height:20px; fill:var(--ink); }

  /* ---------- LINK BUTTONS ---------- */
  .links{
    display:flex; flex-direction:column; gap:10px;
    position:relative; z-index:1;
  }
  .link-btn{
    display:flex; align-items:center; gap:10px;
    border:2px solid var(--ink);
    border-radius:12px;
    padding:11px 12px;
    text-decoration:none;
    color:var(--ink);
    font-size:15px;
    background:rgba(255,255,255,0.05);
  }
  .link-btn .icon-box{
    width:22px; height:22px;
    border:2px solid var(--ink);
    border-radius:5px;
    display:flex; align-items:center; justify-content:center;
    flex:0 0 auto;
  }
  .link-btn .icon-box svg{ width:13px; height:13px; fill:var(--ink); }
  .link-btn .label{ flex:1; }
  .link-btn .chevron{ font-size:18px; line-height:1; }

  @media (prefers-reduced-motion:no-preference){
    .screen{ animation:rise 700ms ease-out; }
  }
  @keyframes rise{
    from{ opacity:0; transform:translateY(10px); }
    to{ opacity:1; transform:translateY(0); }
  }

  a:focus-visible, .social-icon:focus-visible{
    outline:2px solid #4a5a2a;
    outline-offset:2px;
  }
</style>
</head>
