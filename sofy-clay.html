<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Satvik Patel — Creator</title>
<style>
  :root{
    --ink:#161821;
    --sub:#6b7280;
    --blue:#2f6fed;
    --card:#f4f5f7;
    --pill:#eef0f3;
    --pill-shadow-l: rgba(255,255,255,0.9);
    --pill-shadow-d: rgba(163,168,178,0.45);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100%;
    background:#e9eaee;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px 16px;
  }

  .stage{
    position:relative;
    width:390px;
    max-width:100%;
  }

  .card{
    position:relative;
    background:linear-gradient(180deg,#fbfbfc 0%, #f2f3f5 100%);
    border-radius:44px;
    padding:28px 26px 34px;
    box-shadow:
      0 30px 60px rgba(120,124,134,0.28),
      0 2px 6px rgba(120,124,134,0.15),
      inset 0 1px 0 rgba(255,255,255,0.6);
    overflow:hidden;
    z-index:2;
  }

  /* blob cloud shapes in corners */
  .blob{
    position:absolute;
    background:#ffffff;
    z-index:0;
  }
  .blob-tl{
    top:-40px; left:-60px;
    width:200px; height:220px;
    border-radius:45% 55% 60% 40% / 50% 45% 55% 50%;
    opacity:.9;
  }
  .blob-tr{
    top:-30px; right:-50px;
    width:170px; height:150px;
    border-radius:40% 60% 55% 45% / 55% 40% 60% 45%;
    opacity:.85;
  }

  .top-row{
    position:relative;
    z-index:3;
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:8px;
  }

  .badge-creator{
    background:#ffffff;
    color:var(--blue);
    font-weight:700;
    font-size:15px;
    padding:9px 20px;
    border-radius:20px;
    box-shadow:0 4px 10px rgba(120,124,134,0.18);
  }

  .top-icons{
    display:flex;
    gap:10px;
  }
  .icon-btn{
    width:38px;height:38px;
    background:#ffffff;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 10px rgba(120,124,134,0.18);
    color:#20242e;
  }

  .avatar-wrap{
    position:relative;
    z-index:3;
    display:flex;
    justify-content:center;
    margin:18px 0 18px;
  }
  .avatar{
    width:150px;height:150px;
    border-radius:50%;
    background:#ffffff;
    padding:6px;
    box-shadow:0 10px 24px rgba(120,124,134,0.25);
  }
  .avatar-inner{
    width:100%;height:100%;
    border-radius:50%;
    background:linear-gradient(145deg,#2b2f3a,#454b5c);
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  .avatar-inner svg{width:72%;height:72%;color:#c9cdd6;}

  .name-row{
    position:relative;
    z-index:3;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }
  .name{
    font-size:30px;
    font-weight:800;
    color:var(--ink);
    letter-spacing:-0.3px;
  }
  .verified{
    width:24px;height:24px;
    margin-left:2px;
    background:var(--blue);
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    flex-shrink:0;
  }
  .verified svg{width:14px;height:14px;color:#fff;}

  .tagline{
    position:relative;
    z-index:3;
    text-align:center;
    color:var(--sub);
    font-size:16.5px;
    line-height:1.45;
    margin-top:10px;
    font-weight:500;
  }

  .socials{
    position:relative;
    z-index:3;
    display:flex;
    justify-content:center;
    gap:14px;
    margin:24px 0 26px;
  }
  .social-btn{
    width:48px;height:48px;
    border-radius:16px;
    background:var(--pill);
    display:flex;align-items:center;justify-content:center;
    box-shadow: 5px 5px 10px var(--pill-shadow-d), -5px -5px 10px var(--pill-shadow-l);
    color:#1a1d24;
  }
  .social-btn.blue{color:var(--blue);}
  .social-btn.twitter{color:#3aa0f3;}

  .links{
    position:relative;
    z-index:3;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .link-pill{
    display:flex;
    align-items:center;
    gap:14px;
    background:var(--pill);
    border-radius:26px;
    padding:14px 18px;
    box-shadow: 6px 6px 12px var(--pill-shadow-d), -6px -6px 12px var(--pill-shadow-l);
  }
  .link-icon{
    width:44px;height:44px;
    border-radius:14px;
    flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    background:#ffffff;
    box-shadow:0 3px 8px rgba(120,124,134,0.18);
  }
  .link-icon svg{width:22px;height:22px;}
  .link-icon.youtube{background:#ff1f1f;color:#fff;}
  .link-icon.youtube svg{width:18px;height:18px;}
  .link-icon.work{background:#f2f3f5;}
  .link-icon.work svg{width:22px;height:22px;color:#c7791f;}
  .link-icon.mail{background:#3f5cf0;}
  .link-icon.mail svg{width:20px;height:20px;color:#fff;}

  .link-text{flex:1; min-width:0;}
  .link-title{
    font-size:17px; font-weight:700; color:var(--ink);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .link-sub{
    font-size:14px; color:var(--sub); margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .chevron{color:#9aa0ab; flex-shrink:0;}
</style>
</head>
<body>
